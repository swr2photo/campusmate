[package]
name = "campusmate-matching"
version = "0.1.0"
edition = "2021"
publish = false
description = "Ranked friend discovery for CampusMate (Cloud Run)"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
firestore = { version = "0.44", default-features = false, features = ["tls-webpki-roots"] }
gcloud-sdk = { version = "0.26", default-features = false, features = ["google-firestore-v1", "tls-webpki-roots"] }
hmac = "0.12"
jsonwebtoken = "9"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
