// SPIKE STATUS: not yet built. Confirm the Kotlin / Compose compiler and
// Amplify UI Liveness versions against the Expo 58 + RN toolchain first.
buildscript {
  repositories { mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}
apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.faceliveness'
version = '0.1.0'

android {
  namespace 'expo.modules.faceliveness'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  buildFeatures {
    compose true
  }
}

dependencies {
  // AWS-maintained Jetpack Compose liveness detector.
  implementation 'com.amplifyframework.ui:liveness:1.12.0'
  implementation 'androidx.activity:activity-compose:1.9.3'
}
