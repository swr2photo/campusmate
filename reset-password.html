<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รีเซ็ตรหัสผ่าน | CampusMate</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: linear-gradient(135deg, #f3e8ff 0%, #ffffff 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .glass-panel {
      width: 100%;
      max-width: 28rem;
      padding: 2rem;
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px 0 rgba(107, 33, 168, 0.1);
    }
    .text-center { text-align: center; }
    .hidden { display: none !important; }
    .mb-8 { margin-bottom: 2rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mb-4 { margin-bottom: 1rem; }
    .mt-2 { margin-top: .5rem; }
    .w-16, .h-16 { width: 4rem; height: 4rem; }
    .w-8, .h-8 { width: 2rem; height: 2rem; }
    .w-full { width: 100%; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .rounded-2xl { border-radius: 1rem; }
    .rounded-3xl { border-radius: 1.5rem; }
    .rounded-xl { border-radius: .75rem; }
    .rounded-lg { border-radius: .5rem; }
    .bg-purple-600 { background: #9333ea; }
    .bg-red-50 { background: #fef2f2; }
    .bg-green-100 { background: #dcfce7; }
    .text-white { color: #fff; }
    .text-gray-800 { color: #1f2937; }
    .text-gray-700 { color: #374151; }
    .text-gray-500 { color: #6b7280; }
    .text-red-600, .text-red-500 { color: #dc2626; }
    .text-green-500 { color: #22c55e; }
    .text-purple-500 { color: #a855f7; }
    .text-2xl { font-size: 1.5rem; line-height: 2rem; }
    .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
    .text-sm { font-size: .875rem; line-height: 1.25rem; }
    .font-semibold { font-weight: 600; }
    .font-medium { font-weight: 500; }
    .block { display: block; }
    .p-3 { padding: .75rem; }
    input { display: block; width: 100%; padding: .75rem 1rem; border: 1px solid #e5e7eb; border-radius: .75rem; background: rgba(255,255,255,.5); font: inherit; }
    input:focus { background: #fff; outline: 2px solid transparent; border-color: transparent; box-shadow: 0 0 0 2px #a855f7; }
    label { display: block; margin-bottom: .25rem; }
    form > div + div { margin-top: 1.25rem; }
    button { display: flex; align-items: center; justify-content: center; width: 100%; border: 0; border-radius: .75rem; padding: .75rem 1rem; color: #fff; background: #9333ea; font: inherit; font-weight: 500; cursor: pointer; }
    button:hover { background: #7e22ce; }
    button:disabled { opacity: .7; cursor: wait; }
    .border { border-width: 1px; border-style: solid; }
    .border-red-100 { border-color: #fee2e2; }
    .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,.12); }
    .animate-spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="glass-panel w-full max-w-md p-8 rounded-3xl">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-purple-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="text-2xl font-semibold text-gray-800">ตั้งรหัสผ่านใหม่</h1>
      <p class="text-gray-500 text-sm mt-2" id="statusMessage">กำลังโหลดข้อมูล...</p>
    </div>

    <form id="resetForm" class="space-y-5 hidden">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่านใหม่</label>
        <input type="password" id="newPassword" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all" placeholder="อย่างน้อย 8 ตัวอักษร">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ยืนยันรหัสผ่านใหม่</label>
        <input type="password" id="confirmPassword" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all" placeholder="กรอกรหัสผ่านอีกครั้ง">
      </div>
      
      <div id="errorBox" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100"></div>

      <button type="submit" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center">
        <span>บันทึกรหัสผ่านใหม่</span>
      </button>
    </form>

    <div id="successBox" class="hidden text-center">
      <div class="w-16 h-16 bg-green-100 rounded-full mx-auto flex items-center justify-center mb-4">
        <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      </div>
      <h3 class="text-xl font-medium text-gray-800 mb-2">เปลี่ยนรหัสผ่านสำเร็จ</h3>
      <p class="text-gray-500 mb-6">คุณสามารถกลับไปที่แอปพลิเคชันและเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้ทันที</p>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module" nonce="BdM11ZAzmE0GzRoHMNkFmFul">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACPwvYOrzMDgNYUK4hXxSenVmnaaVPXqs",
      authDomain: "campusmate-7f1ab.firebaseapp.com",
      projectId: "campusmate-7f1ab",
      messagingSenderId: "865275661439",
      appId: "1:865275661439:web:a8b550238c9115a1c9c34a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const urlParams = new URLSearchParams(window.location.search);
    const actionCode = urlParams.get('oobCode');

    const resetForm = document.getElementById('resetForm');
    const successBox = document.getElementById('successBox');
    const statusMessage = document.getElementById('statusMessage');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    if (!actionCode) {
      statusMessage.textContent = 'ไม่พบรหัสอ้างอิงสำหรับรีเซ็ตรหัสผ่าน กรุณากดลิงก์จากอีเมลใหม่อีกครั้ง';
      statusMessage.className = 'text-red-500 text-sm mt-2 font-medium';
    } else {
      statusMessage.textContent = 'กำลังตรวจสอบลิงก์...';
      verifyPasswordResetCode(auth, actionCode).then((email) => {
        statusMessage.textContent = `รีเซ็ตรหัสผ่านสำหรับอีเมล: ${email}`;
        statusMessage.className = 'text-gray-500 text-sm mt-2';
        resetForm.classList.remove('hidden');
      }).catch((error) => {
        statusMessage.textContent = 'ลิงก์นี้หมดอายุหรือถูกใช้งานไปแล้ว กรุณาขอลิงก์รีเซ็ตรหัสผ่านใหม่จากในแอปพลิเคชัน';
        statusMessage.className = 'text-red-500 text-sm mt-2 font-medium';
      });
    }

    resetForm.addEventListener('submit', (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        errorBox.textContent = 'รหัสผ่านต้องมีความยาวอย่างน้อย 8 ตัวอักษร';
        errorBox.classList.remove('hidden');
        return;
      }

      if (newPassword !== confirmPassword) {
        errorBox.textContent = 'รหัสผ่านทั้งสองช่องไม่ตรงกัน';
        errorBox.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> กำลังบันทึก...';

      confirmPasswordReset(auth, actionCode, newPassword).then(() => {
        resetForm.classList.add('hidden');
        statusMessage.classList.add('hidden');
        successBox.classList.remove('hidden');
      }).catch((error) => {
        errorBox.textContent = 'ไม่สามารถเปลี่ยนรหัสผ่านได้ กรุณาขอลิงก์รีเซ็ตรหัสผ่านใหม่';
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'บันทึกรหัสผ่านใหม่';
      });
    });
  </script>
</body>
</html>
