# Staging source validation. Does not change Neon or deploy an API.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['run', '-d', '--name', 'postgres', '--network', 'cloudbuild', '-e', 'POSTGRES_USER=integration', '-e', 'POSTGRES_PASSWORD=disposable-ci-only', '-e', 'POSTGRES_DB=campusmate_test', 'postgres:18-bookworm']
  - name: rust:1.99-bookworm
    entrypoint: bash
    env: ['DATABASE_URL=postgres://integration:disposable-ci-only@postgres:5432/campusmate_test?sslmode=disable']
    args:
      - -c
      - |
        set -euo pipefail
        rustup component add rustfmt clippy
        cargo fmt
        cargo test --locked --all-targets --no-fail-fast
        cargo clippy --locked --all-targets -- -D warnings
        tar -czf /workspace/validated-source.tgz Cargo.lock src
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args: ['gcloud', 'storage', 'cp', '/workspace/validated-source.tgz', 'gs://campusmate-7f1ab_cloudbuild/identity-validation/$BUILD_ID/validated-source.tgz']
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
