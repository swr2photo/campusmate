# Test the isolated inbox release before migrating the existing API database.
# Owner credentials are injected only into the migration step, never the API.
# Uploading the artifact also requires object-create access on the output bucket;
# the temporary binding used for the 2026-10-23 run was removed after upload.
serviceAccount: projects/campusmate-7f1ab/serviceAccounts/campusmate-rust-schema-ci@campusmate-7f1ab.iam.gserviceaccount.com
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['run', '-d', '--name', 'postgres', '--network', 'cloudbuild', '-e', 'POSTGRES_USER=integration', '-e', 'POSTGRES_PASSWORD=disposable-ci-only', '-e', 'POSTGRES_DB=campusmate_test', 'postgres:18-bookworm']
  - name: rust:1.99-bookworm
    id: verify-and-build
    entrypoint: bash
    env:
      - DATABASE_URL=postgres://integration:disposable-ci-only@postgres:5432/campusmate_test?sslmode=disable
      - CARGO_PROFILE_RELEASE_LTO=false
      - CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
      - CARGO_TERM_COLOR=never
    args:
      - -c
      - |
        set -euo pipefail
        rustup component add rustfmt clippy
        cargo fmt
        cargo clippy --locked --all-targets -- -D warnings
        cargo test --locked --all-targets --no-fail-fast
        cargo build --locked --release --bin campusmate-backend --bin migrate --bin check-database
        mkdir -p /workspace/inbox-bin
        cp target/release/campusmate-backend target/release/migrate target/release/check-database /workspace/inbox-bin/
        tar -czf /workspace/inbox-release.tgz -C /workspace inbox-bin
        sha256sum /workspace/inbox-release.tgz
  - name: rust:1.99-bookworm
    id: migrate-existing-api-database
    entrypoint: bash
    secretEnv: ['DATABASE_DIRECT_URL', 'NEON_API_DATABASE_URL']
    env: ['APP_ENV=production', 'RUST_LOG=error', 'DB_POOL_MODE=transaction', 'DB_MAX_CONNECTIONS=2', 'DB_MIN_CONNECTIONS=0']
    args:
      - -c
      - |
        set -euo pipefail
        ./target/release/check-database --kind owner
        ./target/release/migrate
        unset DATABASE_DIRECT_URL
        export DATABASE_URL="$$NEON_API_DATABASE_URL"
        unset NEON_API_DATABASE_URL
        ./target/release/check-database --kind api
        printf 'INBOX_SCHEMA_AND_RUNTIME_OK\n'
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args: ['gcloud', 'storage', 'cp', '/workspace/inbox-release.tgz', 'gs://campusmate-7f1ab_cloudbuild/inbox-release/$BUILD_ID/inbox-release.tgz']
availableSecrets:
  secretManager:
    - versionName: projects/campusmate-7f1ab/secrets/CAMPUSMATE_NEON_SCHEMA_CHECK_OWNER/versions/1
      env: DATABASE_DIRECT_URL
    - versionName: projects/campusmate-7f1ab/secrets/CAMPUSMATE_NEON_SCHEMA_CHECK_API/versions/1
      env: NEON_API_DATABASE_URL
options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
