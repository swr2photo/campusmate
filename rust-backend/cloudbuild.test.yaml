# Tests only against disposable PostgreSQL. Creates no production database/service.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['run', '-d', '--name', 'postgres', '--network', 'cloudbuild', '-e', 'POSTGRES_USER=integration', '-e', 'POSTGRES_PASSWORD=disposable-ci-only', '-e', 'POSTGRES_DB=campusmate_test', 'postgres:18-bookworm']
  - name: rust:1.99-bookworm
    entrypoint: bash
    env:
      - DATABASE_URL=postgres://integration:disposable-ci-only@postgres:5432/campusmate_test?sslmode=disable
    args:
      - -c
      - |
        set -euo pipefail
        rustc --version
        rustup component add rustfmt clippy
        cargo fmt --check
        cargo test --locked --all-targets --no-fail-fast -- --nocapture
        cargo clippy --locked --all-targets -- -D warnings
        cargo build --locked --release
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
