<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>ตั้งรหัสผ่านใหม่ · CampusMate</title>
<link rel="stylesheet" href="/auth/assets/auth.css">
<script src="/auth/assets/auth.js" defer></script>
</head>
<body data-page="reset">
<main class="card" aria-labelledby="title">
  <p class="brand">CampusMate</p>
  <h1 id="title">ตั้งรหัสผ่านใหม่</h1>
  <p class="lead" id="lead">ตั้งรหัสผ่านใหม่สำหรับบัญชีของคุณ อุปกรณ์ที่เข้าสู่ระบบไว้จะถูกออกจากระบบทั้งหมด</p>
  <noscript><p class="notice error">หน้านี้ต้องเปิด JavaScript เพื่อเปลี่ยนรหัสผ่านอย่างปลอดภัย</p></noscript>
  <form id="action-form" method="post" novalidate hidden>
    <label for="password">รหัสผ่านใหม่</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128"
      required aria-describedby="password-hint password-error" spellcheck="false" autocapitalize="off">
    <p class="hint" id="password-hint">อย่างน้อย 12 ตัวอักษร ใช้ประโยคที่จำง่ายแต่เดายากก็ได้</p>
    <p class="field-error" id="password-error" hidden></p>

    <label for="confirm">ยืนยันรหัสผ่านใหม่</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128" required
      aria-describedby="confirm-error" spellcheck="false" autocapitalize="off">
    <p class="field-error" id="confirm-error" hidden></p>

    <label class="toggle"><input type="checkbox" id="show"> แสดงรหัสผ่าน</label>
    <button type="submit" class="primary" id="submit">บันทึกรหัสผ่านใหม่</button>
  </form>
  <p class="notice" id="status" role="status" aria-live="polite" hidden></p>
  <p class="hint" id="next" hidden>กลับไปที่แอป CampusMate แล้วเข้าสู่ระบบด้วยรหัสผ่านใหม่</p>
</main>
</body>
</html>
