<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>ยืนยันอีเมล · CampusMate</title>
<link rel="stylesheet" href="/auth/assets/auth.css">
<script src="/auth/assets/auth.js" defer></script>
</head>
<body data-page="verify">
<main class="card" aria-labelledby="title">
  <p class="brand">CampusMate</p>
  <h1 id="title">ยืนยันอีเมลของคุณ</h1>
  <p class="lead" id="lead">แตะปุ่มด้านล่างเพื่อยืนยันว่าอีเมลนี้เป็นของคุณ</p>
  <noscript><p class="notice error">หน้านี้ต้องเปิด JavaScript เพื่อยืนยันอีเมลอย่างปลอดภัย</p></noscript>
  <form id="action-form" method="post" novalidate hidden>
    <button type="submit" class="primary" id="submit">ยืนยันอีเมล</button>
  </form>
  <p class="notice" id="status" role="status" aria-live="polite" hidden></p>
  <p class="hint" id="next" hidden>กลับไปที่แอป CampusMate แล้วเข้าสู่ระบบได้เลย</p>
</main>
</body>
</html>
