<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ตั้งรหัสผ่านใหม่ · CampusMate</title>
  <link rel="stylesheet" href="/auth/assets/action.css">
  <script src="/auth/assets/action.js" defer></script>
</head>
<body data-action="reset-password">
  <main>
    <p class="brand">CampusMate</p>
    <h1>ตั้งรหัสผ่านใหม่</h1>
    <p>เลือกรหัสผ่านที่ใช้กับ CampusMate เท่านั้น เมื่อสำเร็จ ระบบจะออกจากบัญชีบนอุปกรณ์ที่เคยเข้าสู่ระบบ</p>
    <form id="action-form" method="post">
      <label for="password">รหัสผ่านใหม่</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required maxlength="256" aria-describedby="password-hint status">
      <p id="password-hint" class="hint">ใช้รหัสผ่าน 12–128 ตัวอักษร</p>
      <label for="confirmation">ยืนยันรหัสผ่านใหม่</label>
      <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required maxlength="256" aria-describedby="status">
      <button id="submit" type="submit" disabled aria-describedby="status">บันทึกรหัสผ่านใหม่</button>
    </form>
    <p id="status" role="status" aria-live="polite" aria-atomic="true">กำลังตรวจลิงก์…</p>
    <noscript>กรุณาเปิด JavaScript แล้วเปิดลิงก์ในอีเมลอีกครั้ง</noscript>
  </main>
</body>
</html>
